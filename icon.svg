<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090e1c"/>
      <stop offset="55%" stop-color="#111a31"/>
      <stop offset="100%" stop-color="#0b1326"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#090e1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="bar5" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <!-- Studio dark base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="18" y="18" width="476" height="476" rx="96" fill="none" stroke="#334155" stroke-opacity="0.45" stroke-width="4"/>

  <!-- Outer studio cue ring -->
  <circle cx="256" cy="232" r="168" fill="#0d1629" stroke="url(#ringGrad)" stroke-width="14"/>
  <circle cx="256" cy="232" r="144" fill="none" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="3"/>

  <!-- 5-band bold audio waveform / equalizer crest -->
  <rect x="148" y="198" width="28" height="92" rx="14" fill="url(#bar1)"/>
  <rect x="195" y="152" width="28" height="162" rx="14" fill="url(#bar2)"/>
  <rect x="242" y="122" width="28" height="214" rx="14" fill="url(#bar3)"/>
  <rect x="289" y="164" width="28" height="146" rx="14" fill="url(#bar4)"/>
  <rect x="336" y="206" width="28" height="80" rx="14" fill="url(#bar5)"/>

  <!-- Bottom stereo LED VU strip -->
  <rect x="106" y="428" width="38" height="18" rx="9" fill="#10b981"/>
  <rect x="154" y="428" width="38" height="18" rx="9" fill="#10b981"/>
  <rect x="202" y="428" width="38" height="18" rx="9" fill="#22d3ee"/>
  <rect x="250" y="428" width="38" height="18" rx="9" fill="#22d3ee"/>
  <rect x="298" y="428" width="38" height="18" rx="9" fill="#f59e0b"/>
  <rect x="346" y="428" width="60" height="18" rx="9" fill="#f43f5e"/>
</svg>
